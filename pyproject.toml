[project]
name = "conference-notebooks"
version = "0.1.0"
description = "Simple local LLM workshop exercises for Sri Trang."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.10,<2",
    "ipykernel>=7,<8",
    "jupyterlab>=4,<5",
    "llama-index-core>=0.14,<0.15",
    "llama-index-embeddings-ollama>=0.10,<0.11",
    "llama-index-llms-ollama>=0.9,<0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
